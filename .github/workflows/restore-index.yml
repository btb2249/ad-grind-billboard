name: Restore index.html

on:
  push:
    branches: [main]
    paths:
      - 'ad-grind-billboard.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy billboard HTML to index.html
        run: cp ad-grind-billboard.html index.html
      - name: Commit index.html if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore index.html from ad-grind-billboard.html [skip ci]"
          git push
